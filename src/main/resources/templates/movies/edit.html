<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Movie</title>
</head>
<body>
    <h1>Edit Movie</h1>
    <form th:action="@{/movies/edit/{id}(id=${movie.movieId})}" th:object="${movie}" method="post">
        <label for="title">Title:</label>
        <input type="text" id="title" th:field="*{title}" required /><br>
        
        <label for="description">Description:</label>
        <input type="text" id="description" th:field="*{description}" required /><br>
        
        <label for="genre">Genre:</label>
        <input type="text" id="genre" th:field="*{genre}" required /><br>
        
        <label for="schedule">Schedule:</label>
        <input type="text" id="schedule" th:field="*{schedule}" required /><br>
        
        <button type="submit">Update</button>
    </form>
    <a href="/movies">Back to Movie List</a>
</body>
</html>
