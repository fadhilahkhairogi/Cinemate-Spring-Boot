<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cinemate - Movie Details</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      background-color: #0a1a2a;
      color: #f0f0f0;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background-color: #071422;
      padding: 0.75rem 1.5rem;
    }

    .navbar-brand {
      font-weight: 700;
      font-size: 1.5rem;
      color: #f0f0f0;
      letter-spacing: 2px;
    }

    .navbar-brand span {
      color: #3ea6ff;
    }

    .form-control {
      background-color: #071422;
      border: none;
      color: #f0f0f0;
    }

    .form-control::placeholder {
      color: #7a8a9e;
    }

    a {
      color: #f0f0f0;
      text-decoration: none;
    }

    a:hover {
      color: #3ea6ff;
    }

    .movie-details-container {
      padding: 2rem 0;
    }

    .movie-poster-lg {
      width: 100%;
      border-radius: 0.75rem;
      box-shadow: 0 0 15px rgba(62, 166, 255, 0.3);
      object-fit: cover;
    }

    .movie-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .movie-meta {
      font-size: 1rem;
      margin-bottom: 0.75rem;
    }

    .badge-genre {
      background-color: #3ea6ff;
      color: #071422;
      margin-right: 0.5rem;
      font-weight: 600;
    }

    .movie-description {
      margin-top: 1.5rem;
      font-size: 1rem;
      line-height: 1.6;
    }

    .schedule-list {
      margin-top: 1rem;
      padding-left: 1.2rem;
    }

    .schedule-list li {
      margin-bottom: 0.5rem;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar d-flex justify-content-between align-items-center">
    <a href="#" class="navbar-brand"><span>CINE</span>MATE</a>
    <form class="d-flex flex-grow-1 mx-3" role="search">
      <input class="form-control" type="search" placeholder="Search movies" aria-label="Search movies" />
    </form>
    <a href="#" class="text-white fs-4"><i class="fas fa-user-circle"></i></a>
  </nav>

  <!-- Movie Details -->
  <div class="container movie-details-container">
    <div class="row g-5">
      <div class="col-md-4">
        <img th:src="@{${movie.posterUrl}}" th:alt="${movie.title}" class="movie-poster-lg" />
      </div>
      <div class="col-md-8">
        <div class="movie-title" th:text="${movie.title}">Movie Title</div>
        <div class="movie-meta">
          <strong>Release Date:</strong> <span th:text="${movie.releaseDate}">2024-12-12</span>
        </div>
        <div class="movie-meta">
          <strong>Duration:</strong> <span th:text="${movie.duration}">2h 15m</span>
        </div>
        <div class="movie-meta">
          <strong>Genres:</strong>
          <span th:each="genre : ${movie.genres}" class="badge badge-genre" th:text="${genre}">Action</span>
        </div>
        <div class="movie-description">
          <strong>Schedule:</strong>
          <ul class="schedule-list">
            <li th:each="time : ${movie.schedule}" th:text="${#temporals.format(time, 'dd MMM yyyy HH:mm')}">20 May 2024 14:00</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer mt-auto py-4 px-3" style="background-color:#071422;">
    <div class="container text-center text-secondary small">
        COPYRIGHT © CINEMATE 2024. ALL RIGHT RESERVED
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
