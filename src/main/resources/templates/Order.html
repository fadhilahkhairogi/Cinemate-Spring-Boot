<script>
  document.addEventListener("DOMContentLoaded", function () {
    const timeSelect = document.querySelector('#schedule');
    const ticketSelect = document.querySelector('#ticketCount');
    const seatMap = document.querySelector('.seat-map');

    ticketSelect.disabled = true;
    seatMap.style.pointerEvents = "none";
    seatMap.style.opacity = "0.5";

    timeSelect.addEventListener('change', function () {
      const selectedScheduleId = timeSelect.value;

      if (selectedScheduleId && selectedScheduleId !== "") {
        ticketSelect.disabled = false;

        // Clear any previously selected seats
        document.querySelectorAll('.seat-checkbox').forEach(cb => {
          cb.checked = false;
        });

        // Fetch new seat availability
        fetch(`/api/schedules/${encodeURIComponent(selectedScheduleId)}/seats`)
          .then(res => res.json())
          .then(seats => {
            document.querySelectorAll('.seat-checkbox').forEach(checkbox => {
              const seatId = checkbox.dataset.seat;
              if (seatId && seats[seatId] === false) {
                checkbox.disabled = true;
                checkbox.classList.add('taken');
              } else {
                checkbox.disabled = false;
                checkbox.classList.remove('taken');
              }
            });
          });
      } else {
        ticketSelect.disabled = true;
        seatMap.style.pointerEvents = "none";
        seatMap.style.opacity = "0.5";
      }
    });

    ticketSelect.addEventListener('change', function () {
      if (ticketSelect.value !== "None" && ticketSelect.value !== "") {
        seatMap.style.pointerEvents = "auto";
        seatMap.style.opacity = "1";
      } else {
        seatMap.style.pointerEvents = "none";
        seatMap.style.opacity = "0.5";
      }
    });



    const form = document.querySelector("form");
    const selectedSeatsInput = document.getElementById("selectedSeatsInput");

    form.addEventListener("submit", function () {
      const selectedSeats = Array.from(document.querySelectorAll(".seat-checkbox:checked"))
        .map(cb => cb.getAttribute("data-seat"));
      selectedSeatsInput.value = selectedSeats.join(",");
    });
  });
</script>
