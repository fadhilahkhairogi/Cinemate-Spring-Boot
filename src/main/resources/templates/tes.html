        <div class="detail-tickets-panel">
            <h2>Detail Tickets</h2>
            <div class="form-group">
                <label>Movie</label>
                <input type="text" th:value="${movie.title}" readonly>
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="text" th:value="${movie.date}" readonly>
            </div>
            <div class="form-group">
                <label>Time</label>
                <input type="text" th:value="${movie.time}" readonly>
            </div>
            <div class="form-group">
                <label>Seat</label>
                <input type="text" th:value="${movie.selectedSeats}" readonly>
            </div>
            <div class="form-group">
                <label>Cinema</label>
                <input type="text" th:value="${movie.cinema}" readonly>
            </div>
            <div class="form-group">
                <label>Estimated Price</label>
                <input type="text" th:value="${movie.price}" readonly>
            </div>
            <button class="checkout-button">CHECKOUT</button>
            <div class="or-separator">OR</div>
            <button class="add-food-button">+ Add Food & Beverage</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const seats = document.querySelectorAll('.seat-grid .seats .seat.available');
            const selectedSeatsInput = document.querySelector('.detail-tickets-panel input[th\\:value=\\"${movie.selectedSeats}\\"]'); // Targeting the Thymeleaf placeholder for dynamic ID

            let selectedSeats = [];

            seats.forEach(seat => {
                seat.addEventListener('click', () => {
                    if (seat.classList.contains('available')) {
                        seat.classList.toggle('selected');
                        updateSelectedSeats();
                    }
                });
            });

            function updateSelectedSeats() {
                selectedSeats = [];
                document.querySelectorAll('.seat-grid .seats .seat.selected').forEach(selectedSeat => {
                    // This part is a simplification. In a real app, you'd map the index to actual row/column
                    const seatIndex = Array.from(seats).indexOf(selectedSeat);
                    const row = String.fromCharCode(65 + Math.floor(seatIndex / 12));
                    const col = (seatIndex % 12) + 1;
                    selectedSeats.push(${row}${col});
                });
                if (selectedSeatsInput) {
                    selectedSeatsInput.value = selectedSeats.join(', ');
                }
            }
        });
    </script>
