<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FnB Cinemate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      background: radial-gradient(circle at top left, #002b4e, #001528);
      background-image: url('./BG.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }

  html {
          background: radial-gradient(circle at top left, #002b43, #001528);
          width: auto;
          height: auto;
      }

      .header-container {
          background: radial-gradient(circle at top left, #002b43, #001528);
          height: 10vh;
      }

      .content {
          background-color: white;
          border: 15px solid #00A6FF;
          border-radius: 25px;
          width: auto;
          height: auto;
          margin: 20px 50px 100px 50px; /* top, right, bottom, left */
          padding-bottom: 30px;
          box-sizing: border-box;
      }

      .title {
          border-radius: 20px;
          display: flex;
          align-items: center;
          background: radial-gradient(circle at top left, #00A6FF, #001528);
          color: white;
          width: 450px;
          height: 60px;
          padding: 10px 10px 10px 10px;
          margin: 20px 0 20px 40px; /* top,right,bottom,left */
      }

      .menu {
          width: auto;
          height: auto;
          margin: 0 50px;
          align-items: center;
          margin-bottom: 20px;
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
          gap: 5px;
          align-items: center;
      }

      .row-menu {
          flex-wrap: wrap;
          display: flex;
          justify-content: center;
          height: auto;
          width: 350px;
          margin-bottom: 25px;
          gap: 15px;
      }

      .type {
          flex: 0 0 auto;
          scroll-snap-align: start;
          border-radius: 10px;
          padding: 10px;
          min-width: 320px;
          width: 100%;
          max-width: 100%;
      }

      .type-name {
          display: flex;
          margin-left: 15px;
          margin-bottom: 8px;
          font-weight: 700;
          font-size: 1.6em;
          color: #333;
      }

      .isi-menu {
          margin-left: 10px;
          margin-right: 10px;
          border: 2px solid #00A6FF;
          border-radius: 20px;
          list-style-type: none;
          width: auto ;
          height: auto;
          display: flex;
          background: white;
          padding: 12px 10px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);   
      }

        .isi-menu:hover{
          transform: scale(1.05);
          transition: transform 0.3s;
          box-shadow: 0 0 20px rgba(0, 166, 255, 1);
        }

      .foto {
          width: 100px;
          padding: 5px;
          border-radius: 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
      }

      .foto-menu {
          border: 2px solid #00A6FF;
          width: 100px;
          height: 100px;
          padding: 0; 
          border-radius: 20px;
          object-fit: cover;
          display: block; 
        }

      .harga-menu {
          width: 120px;
          padding: 5px;
          display: flex;
          margin-top: 8px;
          margin-left: 5px;
          justify-content: center;
          font-weight: bold;
          color: #333;
      }

      .text-menu {
          color: #002b43;
          justify-content: right;
          padding-left: 10px;
          display: flex;
          flex-direction: column;
          justify-content: start;
          flex: 1;
      }

      .text-menu h4 {
          margin: 4px 0;
      }

      .tombol {
          background-color: #999;
          border: 1px solid black;
          border-radius: 20px;
          display: flex;
          width: 95px;
          height: 35px;
          justify-content: center;
          align-items: center;
          margin-top: 60px;
          gap: 10px;
          user-select: none;
          margin-left: 50px;
      }

      .bulat {
          border: 1px solid #026194;
          border-radius: 25px;
          display: flex;
          background-color: #026194;
          height: 25px;
          width: 25px;
          justify-content: center;
          align-items: center;
          color: white;
          font-weight: bold;
          font-size: 1.1em;
          cursor: pointer;
          user-select: none;
          transition: background-color 0.3s ease;
      }

      .bulat:hover {
          background-color: #014c6f;
          border-color: #014c6f;
      }

      .bayar {
          display: flex;
          justify-content: center;
          align-items: center;
          margin-top: 25px;
          gap: 20px;
          flex-wrap: wrap;
          padding: 0 20px;
      }

      .total-price {
          padding-left: 250px;
          padding-right: 220px;
          display: flex;
          margin-top: 10px;
          border-radius: 16px;
          border: 2px solid #00A6FF;
          width: 100%;
          max-width: 500px;
          height: 65px;
          justify-content: center;
          align-items: center;
          font-weight: bold;
          font-size: 1.3em;
          color: #333;
          background: white;
      }

      .checkout {
          background: radial-gradient(circle at top left, #00A6FF, #001528);
          color: white;
          display: flex;
          margin-top: 10px;
          margin-left: 0;
          justify-content: center;
          align-items: center;
          border-radius: 16px;
          border: 2px solid #00A6FF;
          width: 353px;
          height: 73px;
          font-size: 1.5em;
          font-weight: bold;
          cursor: pointer;
          user-select: none;
          transition: background-color 0.3s ease;
      }

      .checkout:hover {
          background-color: #004977;
          border-color: #004977;
      }

    .navbar {
      max-width: 1150px;
      margin: 0 auto;
      padding: 0 15px;
    }

    a {
      color: white;
      text-decoration: none;
    }

    footer {
      color: white;
      padding: 50px 0;
    }

    .footer-container {
      max-width: 1100px;
      margin: auto;
    }

    .footer-logo img {
      height: 60px;
    }

    .footer-link, .footer-contact, .footer-support {
      font-size: 0.95rem;
    }

    .footer-link:hover, .footer-support a:hover {
      text-decoration: underline;
      cursor: pointer;
      color: #f0f0f0;
    }


    .social-icons i {
      font-size: 1.5rem;
      margin-right: 15px;
      color: white;
    }

    .footer-bottom {
      text-align: center;
      margin-top: 40px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <!-- INI NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="./CinemateLogo.png" alt="LogoCinemate" width="150" height="40" class="me-2">
      </a>
      
      <!--MENU MOVIES-->
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-3">
          <li class="nav-item">
            <a class="nav-link active" href="#">Movies</a>
          </li>
        </ul>

        <!--TOMBOL PROFILE-->
        <form class="d-flex align-items-center">
          <button class="btn btn-outline-light rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;" type="button">
            <i class="bi bi-person fs-5"></i>
          </button>
        </form>
      </div>
    </div>
  </nav>
  <!--END OF NAVBAR-->

  <!--GANTI BAGIAN INI YGY-->
  <div class="content">
        <div class="title">
            <img th:src="a.png" height="55px" alt="Logo" />
            <h3>Select Food &amp; Beverage</h3>
        </div>
        <div class="menu">
            <div class="row-menu" th:each="fnb : ${fnbs}" tabindex="0">
                <div class="type">
                    <h2 class="type-name" th:text="${fnb.type}">TYPE</h2>
                    <div class="isi-menu">
                        <div class="foto">
                            <img class="foto-menu" th:src="@{${fnb.posterUrl}}" alt="FnB Image" />
                            <div class="harga-menu" th:text="'Rp. ' + ${#numbers.formatDecimal(fnb.price, 0, 'COMMA', 2, 'POINT')}">Rp. 0</div>
                        </div>
                        <div class="text-menu">
                            <h5 th:text="${fnb.name}">Item Name</h5>
                            <h6 th:text="${fnb.description}">Item Description</h6>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
  <!--END OF ISIAN-->

  <!-- INI FOOTER -->
  <footer>
  <div class="footer-container">
    <div class="row text-white">
      <!-- Logo & Info -->
      <div class="col-md-3 mb-4 footer-logo me-1">
        <img src="./CinemateLogo.png" alt="Cinemate Logo" class="mb-2">
        <p class="d-flex justify-content-center">ABSOLUTE CINEMA</p>
      </div>

      <!-- Movies & F&B -->
      <div class="col-md-2 mb-4 ms-5">
        <a href="#"><p class="footer-link">MOVIES</p></a>
        <a href="#"><p class="footer-link">F&B</p></a>
      </div>

      <!-- CONTACT US, PRIVACY POLICY, TERMS & CONDITIONS -->
      <div class="col-md-3 mb-4 ms-4">
        <a href="#"><p class="footer-link">CONTACT US</p></a>
        <a href="#"><p class="footer-link">PRIVACY POLICY</p></a>
        <a href="#"><p class="footer-link">TERMS & CONDITIONS</p></a>
      </div>

      <!-- Support & Social -->
      <div class="col-md-3 mb-4 ms-3">
        <p class="footer-support fw-bold">CINEMATE SUPPORT</p>
        <p class="footer-support"><i class="fa-solid fa-square-envelope me-2"></i>Cinemate@gmail.com</p>
        <p class="footer-support mb-2 fw-bold">FOLLOW US ON</p>
        <div class="social-icons">
          <a href="#" aria-label="Instagram"><i class="fa-brands fa-square-instagram"></i></a>
          <a href="#" aria-label="YouTube"><i class="fa-brands fa-square-youtube"></i></a>
          <a href="#" aria-label="Facebook"><i class="fa-brands fa-square-facebook"></i></a>
          <a href="#" aria-label="Twitter"><i class="fa-brands fa-square-x-twitter"></i></a>
        </div>
      </div>
    </div>

    <!--TRADEMARK-->
    <div class="footer-bottom">
      COPYRIGHT © <strong>CINEMATE</strong> 2025. ALL RIGHT RESERVED
    </div>

  </div>
  </footer>
  <!--END OF FOOTER-->
</body>
</html>
